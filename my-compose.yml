services:
  app:
    build: .
    volumes:
      - ./data/raw:/app/data/raw:ro
    environment:
      - SOURCE_DATABASE_URL=sqlite:///app/data/raw/northwind.db
      - TARGET_DATABASE_URL=postgresql+psycopg2://pipeline_user:pipeline_pass@db:5432/pipeline_db
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_pass
      POSTGRES_DB: pipeline_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_user -d pipeline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

