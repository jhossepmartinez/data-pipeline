services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_pass
      POSTGRES_DB: pipeline_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_user -d pipeline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql+psycopg2://pipeline_user:pipeline_pass@db:5432/pipeline_db
      SOURCE_DB_PATH: data/raw/northwind.db
      SOURCE_DB_HASH_PATH: data/raw/northwind.db.sha256
      API_KEY: dev-key
      API_PORT: 8000
    depends_on:
      db:
        condition: service_healthy

  pipeline:
    build: .
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql+psycopg2://pipeline_user:pipeline_pass@db:5432/pipeline_db
      SOURCE_DB_PATH: data/raw/northwind.db
      SOURCE_DB_HASH_PATH: data/raw/northwind.db.sha256
    depends_on:
      db:
        condition: service_healthy

  test:
    build: .
    command: ["pytest", "-v"]
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql+psycopg2://pipeline_user:pipeline_pass@db:5432/pipeline_db
      SOURCE_DB_PATH: data/raw/northwind.db
      SOURCE_DB_HASH_PATH: data/raw/northwind.db.sha256
      API_KEY: test-key
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
